# Local infrastructure for AgentGuard: Redis (guard state + agent checkpoints) + LocalStack (local AWS).
#   docker compose up -d        start both
#   docker compose ps           both should be "healthy"
#   docker compose down         stop (add -v to also wipe Redis data)
#
# LocalStack needs LOCALSTACK_AUTH_TOKEN (free non-commercial plan). Put it in
# a .env file next to this one; .env is gitignored. See .env.example.

services:
  redis:
    # Redis 8: JSON + Search are built in; the LangGraph Redis checkpointer needs both.
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]   # survive restarts: approvals, audit
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.0   # pinned: "latest" changes under you
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      SERVICES: s3,ec2,logs,cloudwatch,autoscaling,iam,sts
    healthcheck:
      # The image ships no curl; use its own Python.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  redis-data:
