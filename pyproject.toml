[project]
name = "agentguard"
version = "0.1.0"
description = "A safety gateway between AI agents and their MCP tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "redis>=5",
    "pyyaml>=6",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentguard", "servers", "agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
