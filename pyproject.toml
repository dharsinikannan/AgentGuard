[project]
name = "agentguard"
version = "0.1.0"
description = "A safety gateway between AI agents and their MCP tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "redis>=5",
    "pyyaml>=6",
    "cryptography>=42",   # tokens encrypted at rest (Fernet)
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
agent = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-redis>=0.5",
]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "moto[s3,ec2,logs,cloudwatch,iam]>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentguard", "servers", "agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "localstack: needs a running LocalStack (skipped otherwise)",
    "live: needs docker compose services (Redis 8) running (skipped otherwise)",
]
