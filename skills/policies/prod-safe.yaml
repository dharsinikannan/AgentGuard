name: prod-safe
description: >
  On-call agent in production. May read anything and make reversible changes.
  Destructive actions need a human. Nothing can touch IAM.

allow:
  - "obs__*"                 # logs + metrics: read-only
  - "cloud__get_logs"       # mock cloud only
  - "cloud__list_*"
  - "cloud__scale_service"
  - "cloud__create_instance"
  - "github__whoami"         # GitHub acts as the human who connected it
  - "github__list_*"

require_approval:
  - "cloud__delete_*"
  - "github__comment_*"      # posts publicly under a human's name

deny:
  - "cloud__*iam*"

# Rupees per call. "default" applies to tools with no explicit cost.
tool_costs:
  cloud__create_instance: 250
  cloud__scale_service: 50
  default: 0.5

budget_inr: 1000

loop:
  max_identical_calls: 3
  max_calls_per_task: 40
  window_seconds: 600

# Only reads may be retried after a dropped connection.
safe_to_retry:
  - "obs__*"
  - "github__whoami"
  - "github__list_*"
  - "cloud__get_logs"
  - "cloud__list_*"
