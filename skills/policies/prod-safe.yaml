name: prod-safe
description: >
  On-call agent in production. May read anything and make reversible changes.
  Destructive actions need a human. Nothing can touch IAM.

allow:
  - "obs__*"                 # logs + metrics: read-only
  - "cloud__get_logs"       # mock cloud only
  - "cloud__list_*"
  - "cloud__scale_service"
  - "cloud__create_instance"
  - "github__whoami"         # GitHub acts as the human who connected it
  - "github__list_*"

require_approval:
  - "cloud__delete_*"
  - "github__comment_*"      # posts publicly under a human's name

deny:
  - "cloud__*iam*"

# Rupees per call. "default" applies to tools with no explicit cost.
tool_costs:
  cloud__create_instance: 250
  cloud__scale_service: 50
  default: 0.5

budget_inr: 1000

loop:
  max_identical_calls: 3
  max_calls_per_task: 40
  window_seconds: 600
  # Same intent, varying args: scale api to 4, 6, 8, 12... or get_logs lines=5, 6, 7.
  # Intent = tool + the args listed here; unlisted tools ignore numbers and normalize text.
  max_same_intent: 4
  intent_args:
    cloud__scale_service: [service]
    "obs__get_*": [service]
    cloud__get_logs: [service]

# LLM calls through the gateway (/llm) are charged to the same task budget.
# Rupees per million tokens. ILLUSTRATIVE: check console.groq.com/pricing (USD) and
# convert. A model not listed here is refused: an unpriced model can't be budgeted.
llm_costs:
  openai/gpt-oss-120b:
    input_per_million_inr: 13
    cached_input_per_million_inr: 6.5
    output_per_million_inr: 55
  openai/gpt-oss-20b:
    input_per_million_inr: 7
    cached_input_per_million_inr: 3.5
    output_per_million_inr: 28
llm_max_tokens: 2048     # output cap per LLM call (and never more than the budget can pay)

# Only reads may be retried after a dropped connection.
safe_to_retry:
  - "obs__*"
  - "github__whoami"
  - "github__list_*"
  - "cloud__get_logs"
  - "cloud__list_*"
